[package]
name = "vtamp"
version = "0.5.1"
authors = ["Jang-Ho Hwang <rath@xrath.com>"]
homepage = "https://github.com/rath/vtamp"
repository = "https://github.com/rath/vtamp"
edition = "2024"
rust-version = "1.90"
description = "A music player for the terminal that keeps playing after you detach"
license = "MIT"
readme = "README.md"

[dependencies]
base64 = "0.23"
anyhow = "1"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
crossbeam-queue = "0.3.14"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
directories = "6"
ebur128 = "0.1.10"
fs2 = "0.4"
flate2 = "1"
# Plain HTTP API for apps: hyper's server role adds only httpdate to the lockfile.
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
sha2 = "0.10"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
lofty = "0.25"
# Handles extended-size mdat atoms found in real-world m4a files.
mp4ameta = "0.13"
# Bundled libopus (cmake build) for the headless server cast and remote listening.
opus = "0.4"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
tempfile = "3"
url = "2"
# Count wrapped help rows to bound scrolling at every pane width. Default
# features minus underline-color: that feature's weak termina/termwiz
# references drag unused optional backends into Cargo.lock.
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "crossterm", "layout-cache", "macros", "unstable-rendered-line-info"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Device playback (cpal) is built on macOS only; AAC decodes through AudioToolbox.
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-isomp4", "symphonia-alac", "mp3", "flac", "wav", "vorbis", "tracing"] }
security-framework = "3"
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "ExtendedAudioFile", "objc2-core-audio-types", "objc2-core-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFRunLoop"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVAudioMix", "objc2-core-media", "objc2-media-toolbox"] }
# MTAudioProcessingTap for the radio spectrum; AVFoundation attaches it to the player item.
objc2-media-toolbox = { version = "0.3.2", default-features = false, features = ["std", "MTAudioProcessingTap", "objc2", "objc2-core-audio-types", "objc2-core-media"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSData", "NSDate", "NSGeometry", "NSObject", "NSThread", "NSError", "NSURL", "NSProcessInfo"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "MPMediaEntity", "objc2-app-kit", "objc2-core-foundation"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# No audio device and no ALSA dependency: these builds are headless servers.
# Software AAC decoding is for this target only and never for macOS.
rodio = { version = "0.22", default-features = false, features = ["symphonia-isomp4", "symphonia-alac", "symphonia-aac", "mp3", "flac", "wav", "vorbis", "tracing"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# Independent Ogg implementation that cross-checks the cast page layout.
ogg_pager = "0.7"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
